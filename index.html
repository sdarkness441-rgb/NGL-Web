<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGL - Secret Messages & Reveal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .ngl-gradient { background: linear-gradient(135deg, #f54266 0%, #a83279 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full py-4 px-6 flex justify-between items-center border-b border-slate-800/60 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full ngl-gradient flex items-center justify-center font-black text-lg shadow-lg">N</div>
            <span class="font-extrabold text-xl tracking-wider bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">NGL Reveal</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="switchTab('send')" id="btnTabSend" class="px-3 py-1.5 text-xs font-semibold rounded-full bg-pink-600 text-white transition shadow-md">Kirim Pesan</button>
            <button onclick="checkAdminAccess()" id="btnTabAdmin" class="px-3 py-1.5 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Mode Admin</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center">

        <!-- VIEW 1: KIRIM PESAN (Public) -->
        <div id="viewSend" class="space-y-6">
            <!-- Profile Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden text-center">
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="relative inline-block mb-3">
                    <img id="displayAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500 shadow-md mx-auto">
                    <span class="absolute bottom-0 right-0 w-5 h-5 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div class="flex items-center justify-center space-x-2">
                    <h2 id="displayUsername" class="font-bold text-lg">@hapiz_secret</h2>
                    <button onclick="openProfileModal()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-pen-to-square"></i></button>
                </div>
                <p id="displayPrompt" class="text-slate-400 text-sm mt-1 px-4">Kirim pesan anonim atau jujur tanpa takut ketahuan! 👀</p>
            </div>

            <!-- Message Form -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                <textarea id="msgInput" rows="4" maxlength="300" placeholder="Kirim pesan rahasia ke sini..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 transition resize-none"></textarea>
                
                <!-- Opsional Clue / Nama -->
                <div class="space-y-2">
                    <input type="text" id="senderNameInput" placeholder="Tulis Nama/Nickname kamu (Opsional)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                    <input type="text" id="senderClueInput" placeholder="Berikan Petunjuk/Clue (Mis: Teman sekelas)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                </div>

                <button onclick="sendMessage()" class="w-full py-3.5 rounded-2xl ngl-gradient font-bold text-sm tracking-wide shadow-lg shadow-pink-600/30 hover:opacity-95 active:scale-[0.98] transition">
                    KIRIM PESAN 💌
                </button>
            </div>

            <div class="text-center">
                <button onclick="copyProfileLink()" class="text-xs text-slate-400 hover:text-pink-400 transition inline-flex items-center space-x-1.5 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-800">
                    <i class="fa-solid fa-link"></i>
                    <span>Salin Link Profil Saya</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: MODE ADMIN / KOTAK MASUK -->
        <div id="viewAdmin" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                <div>
                    <h3 class="font-bold text-sm">Kotak Masuk Rahasia</h3>
                    <p class="text-xs text-slate-400" id="msgCountBadge">0 Pesan Masuk</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="changeAdminPin()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl transition">Ubah PIN</button>
                    <button onclick="clearAllMessages()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-1.5 rounded-xl transition">Hapus Semua</button>
                </div>
            </div>

            <!-- List Pesan -->
            <div id="messagesList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Data pesan akan dimuat otomatis lewat Javascript -->
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-slate-900">
        NGL Secret Reveal Engine &bull; Aman & Terenkripsi Lokal
    </footer>

    <!-- MODAL REVEAL SENDER (BONGKAR PENGIRIM) -->
    <div id="revealModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 relative">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-pink-500 flex items-center space-x-2">
                    <i class="fa-solid fa-user-secret"></i>
                    <span>Detail Pelacak Pengirim</span>
                </h3>
                <button onclick="closeRevealModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="revealContent" class="space-y-3 text-xs">
                <!-- Hasil pelacakan dinamis -->
            </div>

            <button onclick="closeRevealModal()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition">
                Tutup
            </button>
        </div>
    </div>

    <!-- MODAL PENGATURAN PROFIL -->
    <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-sm">Edit Profil & Pertanyaan</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 font-semibold uppercase">Username (@handle)</label>
                    <input type="text" id="inputUsername" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-semibold uppercase">Pertanyaan Prompt Utama</label>
                    <input type="text" id="inputPromptText" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-semibold uppercase">URL Foto Profil</label>
                    <input type="text" id="inputAvatarUrl" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white mt-1">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeProfileModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Batal</button>
                <button onclick="saveProfile()" class="flex-1 py-2.5 rounded-xl ngl-gradient text-white text-xs font-semibold">Simpan</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT APLIKASI -->
    <script>
        // Inisialisasi State Lokal
        let profile = JSON.parse(localStorage.getItem('ngl_profile')) || {
            username: '@hapiz_secret',
            prompt: 'Kirim pesan anonim atau jujur tanpa takut ketahuan! 👀',
            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'
        };

        let messages = JSON.parse(localStorage.getItem('ngl_messages')) || [];
        let adminPin = localStorage.getItem('ngl_pin') || '1234';

        // Load profile ke UI
        document.getElementById('displayUsername').innerText = profile.username;
        document.getElementById('displayPrompt').innerText = profile.prompt;
        document.getElementById('displayAvatar').src = profile.avatar;

        function switchTab(tab) {
            const sendView = document.getElementById('viewSend');
            const adminView = document.getElementById('viewAdmin');
            const btnSend = document.getElementById('btnTabSend');
            const btnAdmin = document.getElementById('btnTabAdmin');

            if(tab === 'send') {
                sendView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btnSend.className = "px-3 py-1.5 text-xs font-semibold rounded-full bg-pink-600 text-white transition shadow-md";
                btnAdmin.className = "px-3 py-1.5 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                sendView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btnAdmin.className = "px-3 py-1.5 text-xs font-semibold rounded-full bg-pink-600 text-white transition shadow-md";
                btnSend.className = "px-3 py-1.5 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                renderMessages();
            }
        }

        function checkAdminAccess() {
            let inputPin = prompt("Masukkan PIN Admin Keamanan (Default: 1234):");
            if(inputPin === adminPin) {
                switchTab('admin');
            } else if(inputPin !== null) {
                alert("PIN Salah!");
            }
        }

        function changeAdminPin() {
            let oldPin = prompt("Masukkan PIN Lama:");
            if(oldPin === adminPin) {
                let newPin = prompt("Masukkan PIN Baru (4 digit angka):");
                if(newPin && newPin.length >= 4) {
                    adminPin = newPin;
                    localStorage.setItem('ngl_pin', adminPin);
                    alert("PIN berhasil diubah!");
                } else {
                    alert("PIN minimal 4 karakter.");
                }
            } else if(oldPin !== null) {
                alert("PIN Lama salah!");
            }
        }

        function sendMessage() {
            let text = document.getElementById('msgInput').value.trim();
            let name = document.getElementById('senderNameInput').value.trim() || "Anonim Murni";
            let clue = document.getElementById('senderClueInput').value.trim() || "Tidak ada petunjuk";

            if(!text) {
                alert("Pesan tidak boleh kosong!");
                return;
            }

            // Simulasi Digital Footprint Pengirim
            let devices = ['Android Phone', 'iPhone', 'Windows PC', 'MacBook'];
            let browsers = ['Chrome Mobile', 'Safari Mobile', 'Samsung Internet', 'Opera Mini'];
            let locations = ['Jakarta, Indonesia', 'Bandung, Indonesia', 'Surabaya, Indonesia', 'Kuala Lumpur, Malaysia'];
            let isps = ['Telkomsel', 'Indosat Ooredoo', 'XL Axiata', 'Celcom Digi'];

            let newMsg = {
                id: Date.now(),
                text: text,
                time: new Date().toLocaleString(),
                sender: name,
                clue: clue,
                device: devices[Math.floor(Math.random() * devices.length)],
                browser: browsers[Math.floor(Math.random() * browsers.length)],
                location: locations[Math.floor(Math.random() * locations.length)],
                isp: isps[Math.floor(Math.random() * isps.length)],
                ip: `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`,
                fingerprint: 'fp_' + Math.random().toString(36).substring(2, 10)
            };

            messages.unshift(newMsg);
            localStorage.setItem('ngl_messages', JSON.stringify(messages));

            document.getElementById('msgInput').value = '';
            document.getElementById('senderNameInput').value = '';
            document.getElementById('senderClueInput').value = '';
            
            alert("Pesan rahasia berhasil dikirim secara anonim! 💌");
        }

        function renderMessages() {
            let container = document.getElementById('messagesList');
            document.getElementById('msgCountBadge').innerText = `${messages.length} Pesan Masuk`;

            if(messages.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Belum ada pesan rahasia yang masuk. Bagikan link profilmu!</div>`;
                return;
            }

            container.innerHTML = messages.map(m => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <p class="text-sm text-slate-200 bg-slate-950 p-3 rounded-xl border border-slate-800/60">${m.text}</p>
                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span><i class="fa-regular fa-clock"></i> ${m.time}</span>
                        <button onclick="revealSender(${m.id})" class="bg-pink-600/20 hover:bg-pink-600/30 text-pink-400 border border-pink-500/30 px-3 py-1.5 rounded-lg font-semibold transition flex items-center space-x-1">
                            <i class="fa-solid fa-eye"></i>
                            <span>Bongkar Pengirim</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function revealSender(id) {
            let msg = messages.find(m => m.id === id);
            if(!msg) return;

            let content = `
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between"><span class="text-slate-400">Nama/Nickname:</span> <span class="font-bold text-pink-400">${msg.sender}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Petunjuk (Clue):</span> <span class="text-white">${msg.clue}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Perangkat:</span> <span class="text-slate-200">${msg.device}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Browser:</span> <span class="text-slate-200">${msg.browser}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Perkiraan Lokasi:</span> <span class="text-slate-200">${msg.location}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Provider (ISP):</span> <span class="text-slate-200">${msg.isp}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">IP Simulasi:</span> <span class="text-mono text-slate-400">${msg.ip}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Fingerprint ID:</span> <span class="text-mono text-slate-400">${msg.fingerprint}</span></div>
                </div>
            `;

            document.getElementById('revealContent').innerHTML = content;
            document.getElementById('revealModal').classList.remove('hidden');
        }

        function closeRevealModal() {
            document.getElementById('revealModal').classList.add('hidden');
        }

        function clearAllMessages() {
            if(confirm("Yakin ingin menghapus semua pesan?")) {
                messages = [];
                localStorage.removeItem('ngl_messages');
                renderMessages();
            }
        }

        function openProfileModal() {
            document.getElementById('inputUsername').value = profile.username;
            document.getElementById('inputPromptText').value = profile.prompt;
            document.getElementById('inputAvatarUrl').value = profile.avatar;
            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function saveProfile() {
            profile.username = document.getElementById('inputUsername').value.trim() || '@hapiz_secret';
            profile.prompt = document.getElementById('inputPromptText').value.trim() || 'Kirim pesan rahasia!';
            profile.avatar = document.getElementById('inputAvatarUrl').value.trim() || profile.avatar;

            localStorage.setItem('ngl_profile', JSON.stringify(profile));

            document.getElementById('displayUsername').innerText = profile.username;
            document.getElementById('displayPrompt').innerText = profile.prompt;
            document.getElementById('displayAvatar').src = profile.avatar;

            closeProfileModal();
            alert("Profil berhasil diperbarui!");
        }

        function copyProfileLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link profil berhasil disalin! Bagikan ke teman-temanmu.");
        }
    </script>
</body>
</html>
